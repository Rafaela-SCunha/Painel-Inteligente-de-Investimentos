name: Atualizacao Diaria e Alertas

on:
  schedule:
    # Roda todos os dias às 20:00 UTC (ajuste o horário se necessário para o fuso do Brasil)
    - cron: '0 23 * * *'
  workflow_dispatch:
    
jobs:
  executar_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Coleta e Atualização de Dados
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python coleta.py

      - name: Executar Treinamento e Robô do Telegram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python treina_modelo.py
          python robo_telegram.py